# The same checks on Linux, macOS and Windows, on the oldest Node the package supports and a
# current one. Nothing here touches a chain or needs a secret: the unit tests are chain-free, and
# `npm run posix` starts signerd on temp files with the public test mnemonic and signs nothing.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      # The repository's files are LF; a Windows checkout would otherwise turn them into CRLF and
      # test something no one ships.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `prepare` builds dist/ as part of the install, as it does for anyone installing from git.
      - run: npm ci
      # bash on every runner, so `pipefail` keeps npm test's exit status through the `tee` that keeps
      # the output for the step after it. (npm itself runs the script with cmd on Windows, where
      # `test/*.test.ts` reaches Node unexpanded; Node 22 and later read it as a glob.)
      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      # A job's log needs a signed-in viewer; its annotations do not. So a failure names itself.
      - name: name the failures
        if: failure()
        shell: bash
        run: |
          [ -f test-output.txt ] || exit 0
          # One annotation per kind: every test that did not pass with the lines under it, and the
          # end of the output. Newlines are encoded the way annotations want them.
          enc() { sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}'; }
          notok=$(grep -A 12 -E "^\s*not ok" test-output.txt | head -120 | enc || true)
          [ -n "$notok" ] && echo "::error title=npm test, what did not pass::${notok}"
          echo "::error title=npm test, last 25 lines::$(tail -n 25 test-output.txt | enc)"
      - run: npm run typecheck
      # Real mode bits and a signal signerd can drain on: the two things Windows cannot show.
      - if: runner.os != 'Windows'
        run: npm run posix
