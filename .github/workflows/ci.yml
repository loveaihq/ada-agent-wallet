# The same checks on Linux, macOS and Windows, on the oldest Node the package supports and a
# current one. Nothing here touches a chain or needs a secret: the unit tests are chain-free, and
# `npm run posix` starts signerd on temp files with the public test mnemonic and signs nothing.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      # The repository's files are LF; a Windows checkout would otherwise turn them into CRLF and
      # test something no one ships.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `prepare` builds dist/ as part of the install, as it does for anyone installing from git.
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # Real mode bits and a signal signerd can drain on: the two things Windows cannot show.
      - if: runner.os != 'Windows'
        run: npm run posix
